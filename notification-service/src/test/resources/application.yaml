spring:
  datasource:
    url: jdbc:h2:mem:notification_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    consumer:
      group-id: notification-service-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.payflow.notification.event
        spring.json.value.default.type: com.example.payflow.notification.event.TransferCompletedEvent

notification:
  kafka:
    transfer-completed-topic: payment.transfer-completed
  worker:
    enabled: false
    delay-ms: 1000
    batch-size: 10
    max-retries: 3
