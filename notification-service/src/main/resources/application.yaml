spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5434/paytrans_notification}
    username: ${NOTIFICATION_DB_USERNAME:paytrans}
    password: ${NOTIFICATION_DB_PASSWORD:paytrans}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notification-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.paytrans.notification.event
        spring.json.value.default.type: com.example.paytrans.notification.event.TransferCompletedEvent

server:
  port: ${NOTIFICATION_SERVICE_PORT:8083}

notification:
  kafka:
    transfer-completed-topic: payment.transfer-completed
  worker:
    enabled: ${NOTIFICATION_WORKER_ENABLED:true}
    delay-ms: ${NOTIFICATION_WORKER_DELAY_MS:1000}
    batch-size: ${NOTIFICATION_WORKER_BATCH_SIZE:10}
    max-retries: ${NOTIFICATION_WORKER_MAX_RETRIES:5}
