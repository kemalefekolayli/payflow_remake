spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/paytrans_auth}
    username: ${AUTH_DB_USERNAME:paytrans}
    password: ${AUTH_DB_PASSWORD:paytrans}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${AUTH_SERVICE_PORT:8081}

jwt:
  secret: ${JWT_SECRET:cGF5dHJhbnMtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1tdXN0LWJlLTMyLWJ5dGVzLWxvbmc=}
  expiration: ${JWT_EXPIRATION:3600000}
