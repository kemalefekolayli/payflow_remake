spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5433/payment_db}
    username: ${PAYMENT_DB_USERNAME:payflow}
    password: ${PAYMENT_DB_PASSWORD:payflow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${PAYMENT_SERVICE_PORT:8082}

jwt:
  secret: ${JWT_SECRET:cGF5Zmxvdy1kZXZlbG9wbWVudC1zZWNyZXQta2V5LW11c3QtYmUtMzItYnl0ZXMtbG9uZw==}

outbox:
  worker:
    enabled: ${OUTBOX_WORKER_ENABLED:true}
    delay-ms: ${OUTBOX_WORKER_DELAY_MS:1000}
    batch-size: ${OUTBOX_WORKER_BATCH_SIZE:10}
    max-retries: ${OUTBOX_WORKER_MAX_RETRIES:5}
