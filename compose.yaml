services:
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  payment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payment_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - payment-db-data:/var/lib/postgresql/data

  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d notification_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - notification-db-data:/var/lib/postgresql/data

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      AUTH_DB_USERNAME: payflow
      AUTH_DB_PASSWORD: payflow
      JWT_SECRET: ${JWT_SECRET:-cGF5Zmxvdy1kZXZlbG9wbWVudC1zZWNyZXQta2V5LW11c3QtYmUtMzItYnl0ZXMtbG9uZw==}
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      PAYMENT_DB_USERNAME: payflow
      PAYMENT_DB_PASSWORD: payflow
      JWT_SECRET: ${JWT_SECRET:-cGF5Zmxvdy1kZXZlbG9wbWVudC1zZWNyZXQta2V5LW11c3QtYmUtMzItYnl0ZXMtbG9uZw==}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
    ports:
      - "8082:8082"
    depends_on:
      payment-db:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/notification_db
      NOTIFICATION_DB_USERNAME: payflow
      NOTIFICATION_DB_PASSWORD: payflow
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-notification-service}
    ports:
      - "8083:8083"
    depends_on:
      notification-db:
        condition: service_healthy

volumes:
  auth-db-data:
  payment-db-data:
  notification-db-data:
