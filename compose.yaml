name: paytrans

services:
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paytrans_auth
      POSTGRES_USER: paytrans
      POSTGRES_PASSWORD: paytrans
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paytrans -d paytrans_auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  payment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paytrans_payment
      POSTGRES_USER: paytrans
      POSTGRES_PASSWORD: paytrans
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paytrans -d paytrans_payment"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - payment-db-data:/var/lib/postgresql/data

  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paytrans_notification
      POSTGRES_USER: paytrans
      POSTGRES_PASSWORD: paytrans
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paytrans -d paytrans_notification"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - notification-db-data:/var/lib/postgresql/data

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/paytrans_auth
      AUTH_DB_USERNAME: paytrans
      AUTH_DB_PASSWORD: paytrans
      JWT_SECRET: ${JWT_SECRET:-cGF5dHJhbnMtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1tdXN0LWJlLTMyLWJ5dGVzLWxvbmc=}
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/paytrans_payment
      PAYMENT_DB_USERNAME: paytrans
      PAYMENT_DB_PASSWORD: paytrans
      JWT_SECRET: ${JWT_SECRET:-cGF5dHJhbnMtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1tdXN0LWJlLTMyLWJ5dGVzLWxvbmc=}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
    ports:
      - "8082:8082"
    depends_on:
      payment-db:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/paytrans_notification
      NOTIFICATION_DB_USERNAME: paytrans
      NOTIFICATION_DB_PASSWORD: paytrans
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-notification-service}
    ports:
      - "8083:8083"
    depends_on:
      notification-db:
        condition: service_healthy

volumes:
  auth-db-data:
  payment-db-data:
  notification-db-data:
